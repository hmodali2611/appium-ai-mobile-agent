name: Real Android emulator
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"   # weekly, Monday 09:00 UTC

jobs:
  apidemos:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Appium 2 and the UiAutomator2 driver
        run: |
          npm install -g appium
          appium driver install uiautomator2
      - run: pip install -e ".[dev]"
      - name: Download Appium's public ApiDemos app (npm package android-apidemos)
        run: |
          mkdir -p apps
          cd apps && npm pack android-apidemos --silent && tar xzf android-apidemos-*.tgz package/apks/ApiDemos-debug.apk
          mv package/apks/ApiDemos-debug.apk . && rm -rf package android-apidemos-*.tgz
          ls -la
      - name: Start Appium server
        run: |
          mkdir -p out/real-device
          nohup appium --address 127.0.0.1 --port 4723 --log out/real-device/appium.log > /dev/null 2>&1 &
      - name: Run agents on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: APPIUM_SERVER=http://127.0.0.1:4723 python -m pytest tests_device -v -p no:cacheprovider
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-device-reports
          path: out/real-device/
