name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Heal demo (v2 build renamed the Sign in button)
        run: mobile-agent heal-demo
      - name: Exploratory agent finds the seeded checkout defect
        run: |
          ! mobile-agent explore \
            --goal "Sign in, add Wireless Earbuds to the cart, open the cart, apply promo code SAVE20 and checkout" \
            --data '{"email":"demo@shoplite.test","password":"secret123","promo":"SAVE20"}' \
            --success-text "Order placed" --out out/promo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exploration-reports
          path: out/

  # Real Android emulator run. Enable by setting the repo variable RUN_EMULATOR=true
  # and committing an APK plus matching caps (see README).
  android-emulator:
    if: vars.RUN_EMULATOR == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - run: npm install -g appium && appium driver install uiautomator2
      - run: pip install -e ".[dev]"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: |
            appium --log appium.log &
            sleep 10
            APPIUM_SERVER=http://127.0.0.1:4723 pytest tests_device -q
